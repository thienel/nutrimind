      consumes:
      - application/json
      description: Sends a friend request to another user. Returns 409 if a pending
        or accepted friendship already exists.
      parameters:
      - description: Addressee user ID
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.SendFriendRequestRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Friend request created
          schema:
            $ref: '#/definitions/dto.SendFriendRequestResponse'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: SOCIAL_DISABLED
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Addressee not found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Friendship already exists
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Send friend request
      tags:
      - social
  /social/friends/request/{friendship_id}:
    delete:
      description: Cancels a pending friend request that the current user sent. Only
        the requester can cancel.
      parameters:
      - description: Friendship ID
        in: path
        name: friendship_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: Request cancelled
        "400":
          description: Invalid friendship_id
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: SOCIAL_DISABLED or not the requester
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Friend request not found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Cancel sent friend request
      tags:
      - social
    patch:
      consumes:
      - application/json
      description: Accepts or rejects an incoming friend request identified by friendship_id.
        Action must be "accept" or "reject".
      parameters:
      - description: Friendship ID
        in: path
        name: friendship_id
        required: true
        type: integer
      - description: accept or reject
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.RespondFriendRequestRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated friendship status
          schema:
            $ref: '#/definitions/dto.RespondFriendRequestResponse'
        "400":
          description: Invalid ID or action
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: SOCIAL_DISABLED or not the addressee
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Friend request not found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Accept or reject friend request
      tags:
      - social
  /social/leaderboard:
    get:
      description: Returns the weekly leaderboard ranking the user and their friends
        by number of days they completed all nutrition goals. The current (in-progress)
        day is excluded.
      produces:
      - application/json
      responses:
        "200":
          description: Weekly leaderboard with week_start/end dates
          schema:
            $ref: '#/definitions/dto.GetLeaderboardResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: SOCIAL_DISABLED
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get weekly leaderboard
      tags:
      - social
  /social/users/search:
    get:
      description: Searches for other users by display name or email. Returns each
        result with their current friendship status relative to the caller (none,
        pending_sent, pending_received, friends).
      parameters:
      - description: Search query (display name or email)
        in: query
        name: q
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Search results with friendship status
          schema:
            $ref: '#/definitions/dto.SearchUsersResponse'
        "400":
          description: Missing query parameter q
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: SOCIAL_DISABLED
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Search users
      tags:
      - social
  /users:
    get:
      description: Returns a paginated list of users. Supports filtering by email,
        display_name, role, status, and full-text search via the `search` param.
      parameters:
      - description: Page size (default 20)
        in: query
        name: limit
        type: integer
      - description: Offset (default 0)
        in: query
        name: offset
        type: integer
      - description: Full-text search across display_name and email
        in: query
        name: search
        type: string
      - description: Filter by role (USER | ADMIN)
        in: query
        name: role
        type: string
      - description: Filter by status (ACTIVE | INACTIVE)
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Paginated user list
          schema:
            $ref: '#/definitions/dto.UserListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List users
      tags:
      - users
  /users/{id}:
    delete:
      description: Soft-deletes a user by ID (sets deleted_at, preserves data).
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: User deleted
        "400":
          description: Invalid ID format
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete user
      tags:
      - users
    get:
      description: Returns a single user by their numeric ID.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: User found
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "400":
          description: Invalid ID format
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get user by ID
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Updates a user's role and/or status (admin operation).
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated user
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "400":
          description: Invalid ID or request body
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update user
      tags:
      - users
  /water:
    get:
      description: Returns all individual water intake entries for a given date, with
        the day's running total and the user's daily water target.
      parameters:
      - description: Date in YYYY-MM-DD format
        in: query
        name: date
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Water entries for the day
          schema:
            $ref: '#/definitions/dto.WaterDayResponse'
        "400":
          description: Missing or invalid date
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get water intake by date
      tags:
      - water
    post:
      consumes:
      - application/json
      description: Records a water intake entry for the given date. Multiple entries
        per day are allowed (e.g. each glass separately).
      parameters:
      - description: Water intake data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.LogWaterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Entry logged with updated daily total and target
          schema:
            $ref: '#/definitions/dto.WaterLogResponse'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: ONBOARDING_REQUIRED
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Log water intake
      tags:
      - water
  /water/{id}:
    delete:
      description: Permanently deletes a single water intake entry by ID. Only the
        owner can delete their own entries.
      parameters:
      - description: Water entry ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: Entry deleted
        "400":
          description: Invalid ID
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Entry not found or not owned by user
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete water entry
      tags:
      - water
  /water/history:
    get:
      description: Returns daily aggregated water totals for a date range (from–to
        inclusive). "to" must be >= "from".
      parameters:
      - description: Start date YYYY-MM-DD
        in: query
        name: from
        required: true
        type: string
      - description: End date YYYY-MM-DD (must be >= from)
        in: query
        name: to
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Daily totals for the range with water target
          schema:
            $ref: '#/definitions/dto.WaterHistoryResponse'
        "400":
          description: Missing, invalid, or inverted date range
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get water history range
      tags:
      - water
securityDefinitions:
  BearerAuth:
    description: 'JWT Bearer token — format: "Bearer {token}"'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
