host: localhost:8000
info:
  contact: {}
  description: Backend API for the NutriMind nutrition and health tracking mobile
    app.
  title: NutriMind API
  version: "1.0"
paths:
  /ai/advice:
    post:
      consumes:
      - application/json
      description: Returns personalised nutrition advice from the AI coach based on
        today's logged calories and water intake vs. the user's targets. An optional
        custom prompt can steer the advice. The response always includes a disclaimer
        field.
      parameters:
      - description: Optional prompt (body may be omitted entirely)
        in: body
        name: body
        schema:
          $ref: '#/definitions/dto.GetAdviceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: AI advice with context summary
          schema:
            $ref: '#/definitions/dto.AdviceResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: ONBOARDING_REQUIRED
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error or AI service error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get AI nutrition advice
      tags:
      - ai
  /ai/meal-suggestion:
    post:
      consumes:
      - application/json
      description: Returns a meal suggestion for a given meal type (breakfast, lunch,
        dinner, snack) tailored to the user's calorie and macro targets. Estimated
        nutritional values are included.
      parameters:
      - description: Meal type to suggest for
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.GetMealSuggestionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Suggested meal with estimated macros and disclaimer
          schema:
            $ref: '#/definitions/dto.MealSuggestionResponse'
        "400":
          description: Validation error (invalid meal_type)
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: ONBOARDING_REQUIRED
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error or AI service error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get AI meal suggestion
      tags:
      - ai
  /auth/google:
    post:
      consumes:
      - application/json
      description: Verifies a Google ID token and returns a signed JWT app token +
        refresh token pair. Pass the token from Google Sign-In SDK directly.
      parameters:
      - description: Google ID token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.GoogleSignInRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Sign-in successful
          schema:
            $ref: '#/definitions/dto.GoogleSignInResponse'
        "400":
          description: Missing or malformed request body
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Invalid or expired Google ID token
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Sign in with Google
      tags:
      - auth
  /auth/me:
    get:
      description: Returns the authenticated user's basic profile derived from the
        JWT.
      produces:
      - application/json
      responses:
        "200":
          description: Authenticated user profile
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "401":
          description: Missing, invalid, or expired token
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
