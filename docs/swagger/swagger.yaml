      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Validates a refresh token and issues a new app token + refresh
        token pair (token rotation). The old refresh token is invalidated immediately.
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: New token pair issued
          schema:
            $ref: '#/definitions/dto.RefreshTokenResponse'
        "400":
          description: Missing or malformed request body
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Refresh token invalid, expired, or already revoked
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Refresh token pair
      tags:
      - auth
  /auth/signout:
    post:
      consumes:
      - application/json
      description: Revokes the provided refresh token, blacklisting it immediately.
        The client is responsible for deleting its own app token from secure storage.
      parameters:
      - description: Refresh token to revoke
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.SignOutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Signed out successfully
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "400":
          description: Missing or malformed request body
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Invalid or expired app token
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Sign out
      tags:
      - auth
